<style>
  #cx-demo-root { position: fixed; inset: 0; margin: 0; background: #eef2f7; }
  #cx-demo-root iframe { width: 100%; height: 100%; border: 0; display: block; background: #eef2f7; }
  #cx-demo-notice {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(16px);
    background: #00205B; color: #fff; padding: 10px 18px; border-radius: 999px;
    font: 600 13px/1.4 Arial, Helvetica, sans-serif; letter-spacing: .01em;
    opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
    z-index: 2147483647; box-shadow: 0 6px 20px rgba(0,32,91,.28); max-width: min(90vw, 460px);
    text-align: center;
  }
  #cx-demo-notice.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
<div id="cx-demo-root"><iframe id="cx-demo-frame" title="CX-AI Commissioning Matrix - Demo"></iframe></div>
<div id="cx-demo-notice" role="status" aria-live="polite"></div>
<script type="application/json" id="cx-demo-data">
/* page data extracted to pages/ */
</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('cx-demo-data').textContent);
  var frame = document.getElementById('cx-demo-frame');
  var notice = document.getElementById('cx-demo-notice');
  var noticeTimer = null;

  window.__cxApi = DATA.api;

  window.__cxNotice = function (message) {
    notice.textContent = message;
    notice.classList.add('is-visible');
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(function () { notice.classList.remove('is-visible'); }, 2600);
  };

  function resolve(path) {
    if (DATA.pages[path]) return path;
    var base = path.split('?')[0];
    var project = (path.match(/project_id=([^&]+)/) || [])[1];
    if (project && DATA.pages[base + '?project_id=' + project]) return base + '?project_id=' + project;
    if (DATA.pages[base]) return base;
    return null;
  }

  window.__cxRoute = function (path) {
    var key = resolve(path);
    if (!key) { window.__cxNotice('That page is not part of this demo.'); return; }
    var html = DATA.pages[key]
      .split('__CX_CSS__').join(DATA.assets.css)
      .split('__CX_LOGO__').join(DATA.assets.logo)
      .split('__CX_SHIM__').join(DATA.shim);
    frame.srcdoc = html;
    if (location.hash.slice(1) !== key) {
      try { history.replaceState(null, '', '#' + key); } catch (err) {}
    }
  };

  var start = location.hash.slice(1);
  window.__cxRoute(resolve(start) ? start : DATA.landing);
})();
</script>

</body></html>
