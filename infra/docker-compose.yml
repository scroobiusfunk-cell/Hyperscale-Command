# Local development stack for Inspection Understudy AI.
#
# Postgres carries the pgvector extension because the Requirements Compiler
# will need spec retrieval; nothing in Phase 1 uses vectors yet, but the
# extension lives in a migration rather than in this file so the schema is
# reproducible outside docker-compose.
#
# Usage: docker compose -f infra/docker-compose.yml up -d

name: field-inspection-engine

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fie_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fie}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fie} -d ${POSTGRES_DB:-fie}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO image tags are not pinned here. The RELEASE.* tags could not be
  # verified from the development environment, and a pin that does not
  # resolve breaks the first `make up` for everyone. Pin MINIO_IMAGE and
  # MC_IMAGE in .env once someone has pulled a known-good release.
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fie_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fie_minio_local_dev}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the buckets the API expects, then exits. Evidence and page images
  # are separated so their object-lifecycle rules can differ: evidence goes to
  # cold storage after project close, page images stay warm for curation.
  minio-init:
    image: ${MC_IMAGE:-minio/mc:latest}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-fie_minio} ${MINIO_ROOT_PASSWORD:-fie_minio_local_dev} &&
      mc mb --ignore-existing local/${EVIDENCE_BUCKET:-fie-evidence} &&
      mc mb --ignore-existing local/${DOCUMENTS_BUCKET:-fie-documents} &&
      mc mb --ignore-existing local/${EXPORTS_BUCKET:-fie-exports} &&
      echo 'buckets ready'
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
