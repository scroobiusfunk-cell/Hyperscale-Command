# Tuned for a 2-core / 7 GB CI runner. The Gradle daemon and the Kotlin compile
# daemon are separate JVMs, so their heaps must add up to less than the available
# RAM or the build thrashes instead of failing cleanly.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m

org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official
