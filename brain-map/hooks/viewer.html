<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Brain</title>
<style>
:root{--bg:#0b0d14;--fg:#e6e8ef;--mut:#8a90a6;--panel:#141824cc}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(ellipse at center,#121628 0%,var(--bg) 70%);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab}canvas.drag{cursor:grabbing}
.panel{position:fixed;background:var(--panel);backdrop-filter:blur(8px);border:1px solid #ffffff1a;border-radius:12px;padding:12px 14px}
#top{top:14px;left:14px;width:280px}#top h1{font-size:15px;margin:0 0 2px}#top .s{color:var(--mut);font-size:12px;margin-bottom:8px}
#q{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #ffffff22;background:#0b0d14;color:var(--fg)}
#legend{top:14px;right:14px;max-width:220px;max-height:50vh;overflow:auto}
#legend div{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;font-size:12px}#legend div.off{opacity:.35}
#legend i{width:10px;height:10px;border-radius:50%;flex:none}
#info{bottom:14px;left:14px;max-width:360px;display:none}#info b{display:block;margin-bottom:4px}#info span{color:var(--mut);font-size:12px}
#help{bottom:14px;right:14px;color:var(--mut);font-size:12px}
.row{margin:2px 0}.row a{color:#7cc4ff;cursor:pointer;font-size:12px}
</style></head><body>
<canvas id="c"></canvas>
<div class="panel" id="top"><h1 id="title">Second Brain</h1><div class="s" id="stats"></div><input id="q" placeholder="Search notes… (Enter to fly to it)" autocomplete="off"></div>
<div class="panel" id="legend"></div>
<div class="panel" id="info"></div>
<div class="panel" id="help">Drag nodes · scroll to zoom · drag background to pan · click a node to focus · double-click to release</div>
<script>
const DATA=/*DATA*/null;
const COLORS=['#4cc9f0','#f72585','#ffd166','#06d6a0','#7b8cff','#ff7b54','#c77dff','#90be6d','#f9c74f','#43aa8b'];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr=Math.max(1,window.devicePixelRatio||1);
function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr}addEventListener('resize',resize);resize();
const N=DATA.nodes.map((n,i)=>({...n,i,x:(n.x-.5)*Math.min(W,H)*1.1,y:(n.y-.5)*Math.min(W,H)*1.1,vx:0,vy:0,fixed:false,r:3+Math.sqrt(n.degree)*2.2}));
const E=DATA.edges.map(([a,b])=>({a:N[a],b:N[b]}));
const adj=N.map(()=>new Set());E.forEach(e=>{adj[e.a.i].add(e.b.i);adj[e.b.i].add(e.a.i)});
const hidden=new Set();let sel=null,hover=null,alpha=1;
const col=n=>COLORS[n.group%COLORS.length];
document.getElementById('title').textContent=DATA.root.split('/').pop();
document.getElementById('stats').textContent=N.length+' nodes · '+E.length+' connections';
const lg=document.getElementById('legend');
DATA.groups.forEach((g,i)=>{const d=document.createElement('div');d.innerHTML='<i style="background:'+COLORS[i%COLORS.length]+'"></i>'+g.replace(/</g,'&lt;');
 d.onclick=()=>{hidden.has(i)?hidden.delete(i):hidden.add(i);d.classList.toggle('off');alpha=.3};lg.appendChild(d)});
if(!DATA.groups.length)lg.style.display='none';
let cam={x:0,y:0,k:1};
const toS=(x,y)=>[(x*cam.k+cam.x)+W/2,(y*cam.k+cam.y)+H/2],toW=(sx,sy)=>[(sx-W/2-cam.x)/cam.k,(sy-H/2-cam.y)/cam.k];
function step(){
 if(alpha<.005)return;alpha*=.985;
 const k=60;
 for(let i=0;i<N.length;i++){const a=N[i];for(let j=i+1;j<N.length;j++){const b=N[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01;if(d2>90000)continue;const f=(k*k*2.2)/d2,d=Math.sqrt(d2);dx/=d;dy/=d;a.vx+=dx*f*alpha;a.vy+=dy*f*alpha;b.vx-=dx*f*alpha;b.vy-=dy*f*alpha}}
 for(const e of E){let dx=e.b.x-e.a.x,dy=e.b.y-e.a.y;const d=Math.sqrt(dx*dx+dy*dy)+.01,f=(d-k)*.04*alpha;dx/=d;dy/=d;e.a.vx+=dx*f;e.a.vy+=dy*f;e.b.vx-=dx*f;e.b.vy-=dy*f}
 for(const n of N){n.vx-=n.x*.002*alpha;n.vy-=n.y*.002*alpha;if(!n.fixed){n.x+=n.vx;n.y+=n.vy}n.vx*=.8;n.vy*=.8}
}
const vis=n=>!hidden.has(n.group);
const q=document.getElementById('q');let match=null;
q.oninput=()=>{const s=q.value.trim().toLowerCase();match=s?new Set(N.filter(n=>n.name.toLowerCase().includes(s)).map(n=>n.i)):null};
q.onkeydown=e=>{if(e.key==='Enter'&&match&&match.size){const n=N[[...match][0]];focus(n)}};
function focus(n){sel=n;cam.x=-n.x*cam.k;cam.y=-n.y*cam.k;showInfo(n)}
const info=document.getElementById('info');
function showInfo(n){if(!n){info.style.display='none';return}
 info.style.display='block';info.innerHTML='<b>'+n.name.replace(/</g,'&lt;')+'</b><span>'+DATA.groups[n.group]+' · '+adj[n.i].size+' connections</span><div></div>';
 const box=info.lastChild;[...adj[n.i]].slice(0,12).forEach(j=>{const a=document.createElement('div');a.className='row';const l=document.createElement('a');l.textContent='→ '+N[j].name;l.onclick=()=>focus(N[j]);a.appendChild(l);box.appendChild(a)})}
function draw(){
 step();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 const focusSet=sel?new Set([sel.i,...adj[sel.i]]):hover?new Set([hover.i,...adj[hover.i]]):null;
 ctx.lineWidth=1;
 for(const e of E){if(!vis(e.a)||!vis(e.b))continue;const on=focusSet&&focusSet.has(e.a.i)&&focusSet.has(e.b.i)&&((sel||hover).i===e.a.i||(sel||hover).i===e.b.i);
  const [x1,y1]=toS(e.a.x,e.a.y),[x2,y2]=toS(e.b.x,e.b.y);ctx.strokeStyle=on?'#ffffffcc':focusSet?'#ffffff10':'#ffffff26';ctx.lineWidth=on?1.6:1;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
 for(const n of N){if(!vis(n))continue;const [x,y]=toS(n.x,n.y);const dim=(focusSet&&!focusSet.has(n.i))||(match&&!match.has(n.i));
  const r=n.r*Math.min(1.8,Math.max(.6,cam.k));ctx.globalAlpha=dim?.15:1;
  if(!dim){const g=ctx.createRadialGradient(x,y,0,x,y,r*3);g.addColorStop(0,col(n)+'55');g.addColorStop(1,col(n)+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3,0,7);ctx.fill()}
  ctx.fillStyle=col(n);ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  if(n===sel||match&&match.has(n.i)){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}
  if(!dim&&(n.degree>=4||cam.k>1.6||n===hover||n===sel||(focusSet&&focusSet.has(n.i))||(match&&match.has(n.i)))){ctx.fillStyle='#e6e8ef';ctx.font=(n.degree>=8?'600 ':'')+'12px system-ui';ctx.fillText(n.name.slice(0,28),x+r+4,y+4)}
  ctx.globalAlpha=1}
 requestAnimationFrame(draw)}
function pick(sx,sy){const[x,y]=toW(sx,sy);let best=null,bd=1e9;for(const n of N){if(!vis(n))continue;const d=Math.hypot(n.x-x,n.y-y);if(d<Math.max(8,n.r+4)/Math.min(1.8,Math.max(.6,cam.k))&&d<bd){bd=d;best=n}}return best}
let drag=null,pan=null,moved=false;
cv.onmousedown=e=>{moved=false;const n=pick(e.clientX,e.clientY);if(n){drag=n;n.fixed=true;alpha=Math.max(alpha,.3)}else pan={x:e.clientX-cam.x,y:e.clientY-cam.y};cv.classList.add('drag')};
addEventListener('mousemove',e=>{moved=true;if(drag){[drag.x,drag.y]=toW(e.clientX,e.clientY);alpha=Math.max(alpha,.2)}else if(pan){cam.x=e.clientX-pan.x;cam.y=e.clientY-pan.y}else hover=pick(e.clientX,e.clientY)});
addEventListener('mouseup',e=>{if(drag&&!moved){sel=drag;showInfo(sel)}else if(!drag&&!moved){sel=null;showInfo(null)}drag=null;pan=null;cv.classList.remove('drag')});
cv.ondblclick=e=>{const n=pick(e.clientX,e.clientY);if(n){n.fixed=false;alpha=.5}};
cv.addEventListener('wheel',e=>{e.preventDefault();const[wx,wy]=toW(e.clientX,e.clientY);cam.k=Math.min(6,Math.max(.15,cam.k*Math.exp(-e.deltaY*.0015)));cam.x=e.clientX-W/2-wx*cam.k;cam.y=e.clientY-H/2-wy*cam.k},{passive:false});
cam.k=Math.min(1,Math.min(W,H)/(Math.sqrt(N.length)*70+200));
for(let i=0;i<200;i++)step();
draw();
</script></body></html>
