name: CI

on:
  push:
    # Working branches too, not only main. The guards in these jobs — the
    # schema-contract tests, the outbox tests, mypy — are only worth having if
    # they run on the commit that breaks them, and a branch that never opens a
    # pull request was never checked at all.
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # The database-level guards (safety never auto-clears, rulings are
    # append-only) live in the migration, so the tests that cover them need a
    # real Postgres. REQUIRE_TEST_DATABASE turns a missing one into a failure
    # rather than a silent skip.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: understudy
          POSTGRES_PASSWORD: understudy_ci
          POSTGRES_DB: understudy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U understudy -d understudy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      REQUIRE_TEST_DATABASE: "1"
      TEST_DATABASE_URL: postgresql+psycopg://understudy:understudy_ci@localhost:5432/understudy_test
      DATABASE_URL: postgresql+psycopg://understudy:understudy_ci@localhost:5432/understudy_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        run: mypy app tests

      - name: Pytest
        run: pytest -q

      - name: Migration round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  reviewer:
    name: Reviewer console — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/reviewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/reviewer/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  schemas:
    name: Schemas — compile and validate examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/schemas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/schemas/package-lock.json

      - run: npm ci
      - run: npm run validate
      - run: npm run generate:ts

  field:
    name: Field app — typecheck and offline core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/field
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/field/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
