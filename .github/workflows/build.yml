name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  # write is needed only for the "Publish APK to a branch" step below, which
  # force-pushes the built APK to a single-file orphan branch so it can be
  # fetched over git. Delete that step and this drops back to read.
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # One invocation: a second cold Gradle start on a 2-core runner costs minutes.
      # --no-daemon keeps a single JVM alive for the build rather than leaving a
      # daemon competing for RAM with the Kotlin compile daemon.
      - name: Build and test
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
        timeout-minutes: 45

      - name: Report APK details
        run: |
          echo "### Build output" >> "$GITHUB_STEP_SUMMARY"
          for apk in app/build/outputs/apk/debug/*.apk; do
            echo "- \`$(basename "$apk")\` — $(du -h "$apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hyperscale-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      # The Actions artifact lives on a blob host that is not reachable from every
      # environment. Force-pushing the APK to a throwaway single-file branch makes it
      # retrievable over plain git as well. The branch keeps no history.
      - name: Publish APK to the apk-latest branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          staging=$(mktemp -d)
          cp "$apk" "$staging/hyperscale-debug.apk"
          cd "$staging"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b apk-latest
          git add hyperscale-debug.apk
          git commit -q -m "Debug APK built from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-latest

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14
