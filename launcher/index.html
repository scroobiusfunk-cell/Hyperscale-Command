<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Command</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wallpaper"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>
  <header>
    <h1>Command</h1>
    <time id="clock"></time>
  </header>
  <section id="hero" aria-live="polite">
    <div class="art"></div><div class="glass"></div>
    <div class="hero-text"><div class="hero-name"></div><div class="hero-sub"></div><div class="hero-hint">Press OK to open</div></div>
  </section>
  <main id="grid" role="menu" aria-label="Apps"></main>
  <footer id="status" aria-live="polite"></footer>
  <!-- webOSTVjs ships with the webOS TV SDK; optional, see docs/DEPLOY.md -->
  <script src="webOSTV.js" onerror="void 0"></script>
  <script src="app.js"></script>
  <script src="refract.js"></script>
</body>
</html>
